    <form class="contact-form">
        <h2>Contact Me</h2>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="telephone">Phone:</label>
        <input type="tel" id="telephone" name="telephone" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <div id="form-status" class="form-status" style="display: none;" aria-live="polite"></div>

        <button type="submit">Send</button>
    </form>

    <footer>
        <p>&copy; 2026 Ephakeme Mdlalose. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>

        // ── Nav toggle ────────────────────────────────────────────────────────────────

        const navToggle  = document.getElementById('navToggle');
        const navMenu    = document.getElementById('navMenu');
        const navOverlay = document.getElementById('navOverlay');
        const navLinks   = navMenu.querySelectorAll('.nav-link');

        navToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            navOverlay.classList.toggle('active');
            navToggle.setAttribute('aria-expanded', navMenu.classList.contains('active'));
        });

        navOverlay.addEventListener('click', closeNav);
        navLinks.forEach(link => link.addEventListener('click', closeNav));

        function closeNav() {
            navMenu.classList.remove('active');
            navOverlay.classList.remove('active');
            navToggle.setAttribute('aria-expanded', false);
        }

        // ── EmailJS ───────────────────────────────────────────────────────────────────

        emailjs.init('C-mTJYlv0FVn6J1YJ');    // 🔑 replace with your EmailJS public key

        const form      = document.querySelector('.contact-form');
        const submitBtn = form.querySelector('button[type="submit"]');
        const statusMsg = document.getElementById('form-status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name      = form.name.value.trim();
            const email     = form.email.value.trim();
            const telephone = form.telephone.value.trim();
            const message   = form.message.value.trim();

            if (!name || !email || !message) {
                showStatus('Please fill in all required fields.', 'error');
                return;
            }

            submitBtn.disabled    = true;
            submitBtn.textContent = 'Sending…';

            const templateParams = {
                from_name:  name,
                from_email: email,
                telephone:  telephone,
                message:    message,
                reply_to:   email,
            };

            try {
                await emailjs.send(
                    'service_48mckau',      // 🔑 replace with your EmailJS service ID
                    'template_u191axd',     // 🔑 replace with your EmailJS template ID
                    templateParams
                );
                showStatus("Message sent! I'll get back to you soon.", 'success');
                form.reset();
            } catch (err) {
                console.error('EmailJS error:', err);
                showStatus('Something went wrong. Please try again or email me directly.', 'error');
            } finally {
                submitBtn.disabled    = false;
                submitBtn.textContent = 'Send';
            }
        });

        function showStatus(text, type) {
            statusMsg.textContent   = text;
            statusMsg.className     = `form-status ${type}`;
            statusMsg.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => { statusMsg.style.display = 'none'; }, 6000);
            }
        }

    </script>
</body>
</html>
